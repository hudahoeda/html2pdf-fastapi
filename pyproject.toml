[tool.poetry]
name = "html2pdf-fastapi"
version = "0.1.0"
description = "Service to generate HTML to PDF"
authors = ["Ahmad M. Huda <anotherhuda@gmail.com>"]
license = "MIT License"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.136.3"
uvicorn = "^0.49.0"
selenium = "^4.44.0"
python-multipart = "^0.0.32"
webdriver-manager = "^4.1.2"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"
python-dotenv = "^1.2.2" 
pypdf = {extras = ["image"], version = "^6.13.2"}
Pillow = "^12.2.0"
markdown = "^3.10.2"
pygments = "^2.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.5.1"
isort = "^8.0.1"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi-line-output = 3
